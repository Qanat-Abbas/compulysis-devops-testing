services:
  db:
    image: postgres:16-alpine
    container_name: compulysis-db-jenkins
    environment:
      POSTGRES_DB: compulysis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compulysis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: qanatabbas/compulysis:v1
    container_name: compulysis-backend-jenkins
    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/compulysis_db
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-min-32-chars}
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: http://localhost:8003,http://localhost:8004
      CORS_ALLOW_ORIGIN_REGEX: ""

    ports:
      - "8003:9000"   # host:container

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9000"]

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    restart: unless-stopped

  frontend:
    image: qanatabbas/compulysis:v1
    container_name: compulysis-frontend-jenkins
    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8004:80"

    command: ["nginx", "-g", "daemon off;"]

    restart: unless-stopped

volumes:
  postgres_data:
